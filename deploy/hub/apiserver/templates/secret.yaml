apiVersion: v1
kind: Secret
metadata:
  name: {{ include "model-go-apiserver.fullname" . }}
  labels:
    {{- include "model-go-apiserver.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 开发/联调用明文 values；生产环境改为 external-secrets / 云 Secret Manager 注入，
  # 不要把真实 DSN 提交进 git。
  postgres-dsn: {{ required ".Values.postgres.dsn is required" .Values.postgres.dsn | quote }}
  redis-addr: {{ required ".Values.redis.addr is required" .Values.redis.addr | quote }}
