apiVersion: v1
kind: Service
metadata:
  name: {{ include "model-go-apiserver.fullname" . }}
  labels:
    {{- include "model-go-apiserver.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "model-go-apiserver.name" . }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: 8080
