{{- if .Values.ingress.enabled }}
# 统一入口：/api → apiserver 服务，其余 → console（nginx serve SPA）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "model-go-console.fullname" . }}
  labels:
    {{- include "model-go-console.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.ingress.host | quote }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.backend.host }}
            port:
              number: {{ .Values.backend.port }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "model-go-console.fullname" . }}
            port:
              number: {{ .Values.service.port }}
{{- end }}
