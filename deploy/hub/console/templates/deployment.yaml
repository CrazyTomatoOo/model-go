apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-go-console.fullname" . }}
  labels:
    {{- include "model-go-console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "model-go-console.name" . }}
  template:
    metadata:
      labels:
        {{- include "model-go-console.labels" . | nindent 8 }}
    spec:
      containers:
      - name: console
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: BACKEND_URL
          value: "http://{{ .Values.backend.host }}:{{ .Values.backend.port }}"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: { path: /, port: 8080 }
          initialDelaySeconds: 3
          periodSeconds: 10
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
