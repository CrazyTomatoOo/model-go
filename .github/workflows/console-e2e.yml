name: console-e2e

# Console E2E + Lighthouse CI for the React console (spec #32 §4.1, issue #38).
#
# The Playwright suite runs against the vite preview build of the console with
# /api/v1/auth/** stubbed at the network layer (e2e/fixtures.ts); no service
# containers and no apiserver binary are involved. The real-backend regression
# in e2e/login.spec.ts is gated on E2E_REAL_APISERVER and therefore skips under
# preview — it is run locally/manually and intentionally NOT part of this
# workflow.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/console-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/console-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    name: console E2E (playwright, harness-mocked) + Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install playwright chromium
        working-directory: web
        run: pnpm --filter @model-go/console exec playwright install --with-deps chromium

      # playwright.config.ts webServer builds the app and serves the dist on
      # http://127.0.0.1:4173 via vite preview (no /api proxy); running all
      # specs is a single command, sibling tickets add specs transparently.
      - name: Run E2E
        working-directory: web
        run: pnpm --filter console exec playwright test

      # Keep a preview of the same dist alive for Lighthouse. (lhci's own
      # static server is not used: with staticDistDir it rewrites url ports to
      # its ephemeral server, so absolute 127.0.0.1:4173 urls + a kept-alive
      # preview is the mode that actually audits the preview build.)
      - name: Start preview server for Lighthouse
        working-directory: web/apps/console
        run: |
          pnpm run preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/console-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/login >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/console-preview.log >&2
          echo "preview did not become ready" >&2
          exit 1

      # .lighthouserc.json lives in web/apps/console: /login is the only
      # audited URL — guarded routes need auth mocks lhci cannot provide —
      # with performance as the error-level gate and the other categories
      # on warn (#38). lhci uses the Chrome preinstalled on ubuntu-latest
      # runners (set CHROME_PATH to override).
      - name: Lighthouse CI
        working-directory: web/apps/console
        # Pinned: @latest floated across a breaking change once before.
        run: pnpm dlx @lhci/cli@0.14 autorun 2>&1 | tee /tmp/lhci.log

      # #38: report links where reviewers look — the run's step summary and
      # one sticky PR comment. No GitHub App token needed for either.
      - name: Lighthouse report links
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/lhci.log') ? fs.readFileSync('/tmp/lhci.log', 'utf8') : '';
            const urls = [...new Set([...log.matchAll(/https:\/\/storage\.googleapis\.com\/[^\s)'"]+/g)].map((m) => m[0]))];
            const lines = urls.length
              ? urls.map((u) => `- ${u}`).join('\n')
              : '- (no uploaded report URLs found in the lhci output)';
            await core.summary.addHeading('Lighthouse reports').addRaw(lines).write();
            const pr = context.payload.pull_request;
            if (pr && urls.length > 0) {
              const marker = '<!-- lhci-report-links -->';
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const body = `${marker}\n## Lighthouse reports\n${lines}`;
              const existing = comments.find((c) => c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
              }
            }

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/apps/console/playwright-report/
            web/apps/console/test-results/
          retention-days: 14
